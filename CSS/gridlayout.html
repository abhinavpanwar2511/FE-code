<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            display: grid;
            grid-template-columns: gray;
            gap: 5px;
            background-color: rgb(83, 48, 48);
            padding: 5px;
        }

        .container div{
            background-color: #b09393;
            text-align: center;
            padding: 10px;
            font-size: 30px;
        }

        .item1 {
            grid-column-start: 1;
            grid-column-end: 4;
        }

        .item2 {
            grid-row-start: 2;
            grid-row-end: 4;
        }
    </style>
</head>
<body>
    

    <h1>The grid-column Property</h1>

    <div class="container">
        <div class="item1">Header</div>
        <div class="item2">sidebar</div>
        <div class="item3">3</div>
        <div class="item4">4</div>
        <div class="item5">5</div>
    </div>

</body>
</html>
