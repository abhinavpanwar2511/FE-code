<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Model</title>
    <style>
        * {
            margin: 0px;
        }
        div {
            width: 100px;
            height: 100px;
            background-color: aqua;
            padding: 20px;
            /* border-color: blue;
            border-style: dashed;
            border-width: 3px; */
            border: 5px dashed red;
            /* 1 value margin: 20px; top bottom left right */
            /* 2 values 20px top bottom 40px left right */
            /* 3 values - 20px top 40px left right 60px bottom */
            /* 4 values 20px top 40px right 60px bottom 100px left */
            margin: 20px 40px 60px 100px;
            outline: 10px dashed violet;
            box-shadow: 40px 20px 20px/*(this for blur effect)*/ aquamarine;
        }
    </style>
</head>
<body>
    /*By default we have a margin only not the padding. */
    <div>Box Model</div>
</body>
</html>
