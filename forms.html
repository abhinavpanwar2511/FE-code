<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Captcha form</title>
</head>
<body>
    <h2>Captcha Form</h2>
    <form>
        <label for="Captcha">Enter Captcha: </label>
        <input type="text" id="captcha">
        <br>
        <br>
        <label for="un">Username: </label>
        <input type="text" placeholder="Enter name..." id="un" name="username">
        <br>
        <br>
        <label>Email :</label>
        <input type="email" name="email">
        <br>
        <br>
        <label>Password: <span style="color: red;">*</span> </label>
        <input type="password" name="pwd" required>
        <br>
        <br>
        <label>Mobile :</label>
        <input type="tel">
        <br>
        <br>
        <label>Age :</label>
        <input type="number" min="1" max="150">
        <br>
        <br>
        <label>Date of Birth</label>
        <input type="date">
        <br>
        <br>
        <label>Profile Url :</label>
        <input type="url">
        <br>
        <br>
        <label>Other :</label>
        <input type="color">
        <br>
        <br>
        <label>Date of Birth with time</label>
        <input type="datetime-local">
        <br>
        <br>
        <label>Upload PAN Card :</label>
        <input type="file">
        <br>
        <br>
        <label>Rate out of 5 :</label>
        <input type="range" min="1" max="5" name="HTML Rating" value="0">
        <br>
        <br>
        <input type="submit"> &nbsp; &nbsp; &nbsp; &nbsp;
        <button type="reset">Cancel</button>
        <br>
        <br>
    </form>
</body>
</html>
