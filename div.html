<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Tag</title>
</head>
<body>
    <!-- <center><h1>Heading</h1></center></h1> -->
     <h1 style="text-align: center;">Heading</h1>
     <!-- Block level element- div, pre, p. h1-h6 -->
      <div>Hello</div>
      <div>Hi</div>
      <!-- Inline level element- span, a, b, i, u -->
       <span>Hello</span>
       <span>Hi</span>

       <p>We have to be a <span style="color: red;">knowledgeable</span> person.</p>
</body>
</html>
